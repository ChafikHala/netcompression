experiment:
  name: "resnet20_cifar10_noise60"
  output_dir: "outputs"
  seed: 42
  run_id: "auto"
  device: "auto"

dataset:
  name: "cifar10"
  root: "./data"
  num_classes: 10
  augmentation:
    random_crop: 4
    horizontal_flip: true
    normalize: true
  label_noise_fraction: 0.6


dataloader:
  batch_size: 256
  num_workers: 4
  pin_memory: true

model:
  name: "resnet20"
  num_classes: 10

optimizer:
  type: "sgd"
  lr: 0.1
  momentum: 0.9
  weight_decay: 1e-4
  nesterov: false

scheduler:
  type: "multistep"
  milestones: [100, 150]
  gamma: 0.1

training:
  epochs: 160
  criterion: "cross_entropy"
  label_smoothing: 0.0
  mixed_precision: true

checkpoint:
  save_best_only: true
  save_last: true
  save_every_epochs: 50
  monitor: "val_accuracy"
  mode: "max"

logging:
  print_every_steps: 100
  save_epoch_metrics: true
  save_batch_logs: false

pruning:
  enabled: true
  method: "gradual_cubic_layerwise"  # gradual_cubic_layerwise | global_magnitude

  # Common target sparsity
  initial_sparsity: 0.0
  final_sparsity: 0.45

  # Step-based gradual cubic schedule (used by gradual_cubic_layerwise)
  begin_step: 0
  update_frequency_steps: 100
  num_updates: 100

  # Epoch-based schedule (used by global_magnitude)
  start_epoch: 2
  end_epoch: 200
  frequency: 5

  # Parameter filtering
  exclude_bias: true
  exclude_norm: true