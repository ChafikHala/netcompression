experiment:
  name: "fcn_mnist_baseline"
  output_dir: "outputs"
  seed: 42
  run_id: "auto"
  device: "auto"


dataset:
  name: "mnist"
  root: "./data"
  num_classes: 10

  augmentation:
    random_crop: 0
    horizontal_flip: false
    normalize: true

  noise:
    label_noise_fraction: 0.0

dataloader:
  batch_size: 256
  num_workers: 4
  pin_memory: true

model:
  name: "fcn"
  input_shape: [1, 28, 28]   # C,H,W
  hidden_dims: [512, 256]
  dropout: 0.0

optimizer:
  type: "sgd"
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0
  nesterov: false

scheduler:
  type: "multistep"
  milestones: [10, 15]
  gamma: 0.1

training:
  epochs: 20
  criterion: "cross_entropy"
  label_smoothing: 0.0
  mixed_precision: true

checkpoint:
  save_best_only: true
  save_last: true
  save_every_epochs: 10
  monitor: "val_accuracy"
  mode: "max"

logging:
  print_every_steps: 100      
  save_epoch_metrics: true    
  save_batch_logs: false 

pruning:
  enabled: false
  method: "gradual_cubic_layerwise"  # gradual_cubic_layerwise | global_magnitude

  # Common target sparsity
  initial_sparsity: 0.0
  final_sparsity: 0.5

  # Step-based gradual cubic schedule (used by gradual_cubic_layerwise)
  begin_step: 0
  update_frequency_steps: 100
  num_updates: 100

  # Epoch-based schedule (used by global_magnitude)
  start_epoch: 0
  end_epoch: null
  frequency: 1

  # Parameter filtering
  exclude_bias: true
  exclude_norm: true
