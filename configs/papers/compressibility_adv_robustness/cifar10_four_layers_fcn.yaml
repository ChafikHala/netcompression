experiment:
  name: "placeholder_will_be_overridden"
  output_dir: "outputs_h"
  seed: 42
  device: "auto"

dataset:
  name: "cifar10"
  root: "./data"
  num_classes: 10
  binary: false
  val_fraction: 0.05

  augmentation:
    random_crop: 0
    horizontal_flip: false
    normalize: true

  noise:
    label_noise_fraction: 0.0

dataloader:
  batch_size: 256
  num_workers: 4
  pin_memory: true

model:
  name: "fcn"
  input_shape: [3, 32, 32]
  hidden_dims: [2000, 2000, 2000, 2000]
  dropout: 0.0
  bias: false

optimizer:
  type: "adamw"
  lr: 0.001
  weight_decay: 0.01

training:
  epochs: 100
  criterion: "cross_entropy"
  label_smoothing: 0.0
  early_stopping_patience: 10

paper:
  name: "on_the_interaction_between_compressibility_and_adversarial_robustness"
  experiment: "cifar10_four_layer_fcn"

  compressibility:
    type: "neuron"   # overridden by argparse: neuron or spectral

  regularization:
    type: "group_lasso"   # group_lasso for neuron, low_rank_factorization for spectral
    alpha: 0.0            # only used for neuron compressibility

  factorization:
    rank: 256             # only used for spectral compressibility

  normalization:
    type: "frobenius"
    apply_every_iteration: true
    target: "initial"